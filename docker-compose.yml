services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 5434 no host evita conflito com outros Postgres locais na 5432
      - "5434:5432"
    environment:
      POSTGRES_USER: pallazium
      POSTGRES_PASSWORD: pallazium
      POSTGRES_DB: pallazium
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
