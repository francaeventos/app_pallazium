services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 5433 no host: padrão local deste projeto (5432 costuma estar com outro app)
      - "5433:5432"
    environment:
      POSTGRES_USER: pallazium
      POSTGRES_PASSWORD: pallazium
      POSTGRES_DB: pallazium
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pallazium -d pallazium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
